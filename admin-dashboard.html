<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Dashboard | WebPro Design</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f23;
            color: #fff;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 24px;
        }

        .sidebar-logo img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
        }

        .sidebar-logo span {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-nav {
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-bottom: 8px;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.15);
            color: #fff;
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
        }

        .sidebar-footer {
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
        }

        .user-role {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            color: #fca5a5;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 32px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-title p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .stat-icon.purple { background: rgba(99, 102, 241, 0.15); }
        .stat-icon.green { background: rgba(16, 185, 129, 0.15); }
        .stat-icon.orange { background: rgba(245, 158, 11, 0.15); }
        .stat-icon.red { background: rgba(239, 68, 68, 0.15); }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        /* Table */
        .table-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .table-title {
            font-size: 18px;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 16px;
        }

        .search-box input {
            background: none;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
            width: 200px;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-box svg {
            width: 18px;
            height: 18px;
            color: rgba(255, 255, 255, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 16px 24px;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.5);
        }

        td {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.new {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
        }

        .status-badge.contacted {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
        }

        .status-badge.done {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-badge.new .status-dot { background: #6366f1; }
        .status-badge.contacted .status-dot { background: #f59e0b; }
        .status-badge.done .status-dot { background: #10b981; }

        .action-btn {
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-right: 4px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 8px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a3e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .detail-row {
            display: flex;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            width: 120px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        .detail-value {
            flex: 1;
            font-size: 14px;
        }

        .detail-value a {
            color: #a5b4fc;
            text-decoration: none;
        }

        .detail-value a:hover {
            text-decoration: underline;
        }

        .status-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }

        .status-select option {
            background: #1a1a3e;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 80px;
                padding: 16px;
            }

            .sidebar-logo span,
            .nav-item span,
            .user-details {
                display: none;
            }

            .nav-item {
                justify-content: center;
                padding: 14px;
            }

            .user-info {
                justify-content: center;
            }

            .main-content {
                margin-left: 80px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="logo.png" alt="Logo">
            <span>WebPro</span>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="index.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                <span>Website</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div class="user-details">
                    <div class="user-name" id="user-name">Admin</div>
                    <div class="user-role" id="user-role">Administrator</div>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Abmelden
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <div class="header-title">
                <h1>Anfragen-Übersicht</h1>
                <p>Verwalten Sie alle Rückruf-Anfragen</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="exportData()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Exportieren
                </button>
                <button class="btn btn-primary" onclick="addTestData()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Test-Daten
                </button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon purple">📨</div>
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Gesamt Anfragen</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">✅</div>
                <div class="stat-value" id="stat-done">0</div>
                <div class="stat-label">Erledigt</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">📞</div>
                <div class="stat-value" id="stat-contacted">0</div>
                <div class="stat-label">Kontaktiert</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon red">🆕</div>
                <div class="stat-value" id="stat-new">0</div>
                <div class="stat-label">Neue Anfragen</div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div class="table-header">
                <h2 class="table-title">Alle Anfragen</h2>
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" placeholder="Suchen..." id="search-input" oninput="filterRequests()">
                </div>
            </div>
            <div id="table-body">
                <!-- Table content will be inserted here -->
            </div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Anfrage-Details</h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div id="modal-content">
                <!-- Modal content will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        if (!sessionStorage.getItem('adminLoggedIn')) {
            window.location.href = 'admin.html';
        }

        // Set user info
        const userName = sessionStorage.getItem('adminUser') || 'Admin';
        const userRole = sessionStorage.getItem('adminRole') || 'admin';
        document.getElementById('user-name').textContent = userName.charAt(0).toUpperCase() + userName.slice(1);
        document.getElementById('user-role').textContent = userRole === 'admin' ? 'Administrator' : 'Mitarbeiter';

        // Initialize
        let requests = JSON.parse(localStorage.getItem('contactRequests')) || [];

        function renderTable(data = requests) {
            const tableBody = document.getElementById('table-body');
            
            if (data.length === 0) {
                tableBody.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20 13V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7m16 0v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5m16 0h-2.586a1 1 0 0 0-.707.293l-2.414 2.414a1 1 0 0 1-.707.293h-3.172a1 1 0 0 1-.707-.293l-2.414-2.414A1 1 0 0 0 6.586 13H4"/>
                        </svg>
                        <h3>Keine Anfragen vorhanden</h3>
                        <p>Neue Anfragen erscheinen hier automatisch.</p>
                    </div>
                `;
                return;
            }

            // Sort by date (newest first)
            const sortedData = [...data].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            tableBody.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Datum</th>
                            <th>Name</th>
                            <th>Unternehmen</th>
                            <th>E-Mail</th>
                            <th>Telefon</th>
                            <th>Status</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sortedData.map((req, index) => `
                            <tr>
                                <td>${formatDate(req.timestamp)}</td>
                                <td><strong>${escapeHtml(req.name)}</strong></td>
                                <td>${escapeHtml(req.company || '-')}</td>
                                <td><a href="mailto:${escapeHtml(req.email)}">${escapeHtml(req.email)}</a></td>
                                <td><a href="tel:${escapeHtml(req.phone)}">${escapeHtml(req.phone)}</a></td>
                                <td>
                                    <span class="status-badge ${req.status || 'new'}">
                                        <span class="status-dot"></span>
                                        ${getStatusLabel(req.status || 'new')}
                                    </span>
                                </td>
                                <td>
                                    <button class="action-btn" onclick="viewDetails('${req.id}')" title="Details">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                            <circle cx="12" cy="12" r="3"/>
                                        </svg>
                                    </button>
                                    <button class="action-btn delete" onclick="deleteRequest('${req.id}')" title="Löschen">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="3 6 5 6 21 6"/>
                                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                        </svg>
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = requests.length;
            document.getElementById('stat-new').textContent = requests.filter(r => !r.status || r.status === 'new').length;
            document.getElementById('stat-contacted').textContent = requests.filter(r => r.status === 'contacted').length;
            document.getElementById('stat-done').textContent = requests.filter(r => r.status === 'done').length;
        }

        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleDateString('de-DE', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getStatusLabel(status) {
            const labels = {
                'new': 'Neu',
                'contacted': 'Kontaktiert',
                'done': 'Erledigt'
            };
            return labels[status] || 'Neu';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function filterRequests() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filtered = requests.filter(req => 
                req.name.toLowerCase().includes(searchTerm) ||
                (req.company && req.company.toLowerCase().includes(searchTerm)) ||
                req.email.toLowerCase().includes(searchTerm) ||
                req.phone.includes(searchTerm)
            );
            renderTable(filtered);
        }

        function viewDetails(id) {
            const req = requests.find(r => r.id === id);
            if (!req) return;

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="detail-row">
                    <div class="detail-label">Datum</div>
                    <div class="detail-value">${formatDate(req.timestamp)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Name</div>
                    <div class="detail-value"><strong>${escapeHtml(req.name)}</strong></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Unternehmen</div>
                    <div class="detail-value">${escapeHtml(req.company || '-')}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">E-Mail</div>
                    <div class="detail-value"><a href="mailto:${escapeHtml(req.email)}">${escapeHtml(req.email)}</a></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Telefon</div>
                    <div class="detail-value"><a href="tel:${escapeHtml(req.phone)}">${escapeHtml(req.phone)}</a></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Nachricht</div>
                    <div class="detail-value">${escapeHtml(req.message || 'Keine Nachricht')}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Status</div>
                    <div class="detail-value">
                        <select class="status-select" onchange="updateStatus('${req.id}', this.value)">
                            <option value="new" ${req.status === 'new' || !req.status ? 'selected' : ''}>Neu</option>
                            <option value="contacted" ${req.status === 'contacted' ? 'selected' : ''}>Kontaktiert</option>
                            <option value="done" ${req.status === 'done' ? 'selected' : ''}>Erledigt</option>
                        </select>
                    </div>
                </div>
            `;

            document.getElementById('detail-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        function updateStatus(id, newStatus) {
            const reqIndex = requests.findIndex(r => r.id === id);
            if (reqIndex > -1) {
                requests[reqIndex].status = newStatus;
                localStorage.setItem('contactRequests', JSON.stringify(requests));
                renderTable();
                updateStats();
            }
        }

        function deleteRequest(id) {
            if (confirm('Möchten Sie diese Anfrage wirklich löschen?')) {
                requests = requests.filter(r => r.id !== id);
                localStorage.setItem('contactRequests', JSON.stringify(requests));
                renderTable();
                updateStats();
            }
        }

        function exportData() {
            if (requests.length === 0) {
                alert('Keine Daten zum Exportieren vorhanden.');
                return;
            }

            const csv = [
                ['Datum', 'Name', 'Unternehmen', 'E-Mail', 'Telefon', 'Nachricht', 'Status'].join(';'),
                ...requests.map(r => [
                    formatDate(r.timestamp),
                    r.name,
                    r.company || '',
                    r.email,
                    r.phone,
                    r.message || '',
                    getStatusLabel(r.status || 'new')
                ].map(v => `"${v}"`).join(';'))
            ].join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `anfragen_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function addTestData() {
            const testRequests = [
                {
                    id: 'test-' + Date.now() + '-1',
                    name: 'Max Mustermann',
                    company: 'Mustermann GmbH',
                    email: 'max@mustermann.de',
                    phone: '+49 123 456789',
                    message: 'Ich interessiere mich für eine neue Firmenwebsite.',
                    timestamp: new Date().toISOString(),
                    status: 'new'
                },
                {
                    id: 'test-' + Date.now() + '-2',
                    name: 'Anna Schmidt',
                    company: 'Schmidt Consulting',
                    email: 'anna@schmidt-consulting.de',
                    phone: '+49 987 654321',
                    message: 'Bitte um Rückruf wegen Landingpage.',
                    timestamp: new Date(Date.now() - 86400000).toISOString(),
                    status: 'contacted'
                },
                {
                    id: 'test-' + Date.now() + '-3',
                    name: 'Thomas Weber',
                    company: '',
                    email: 'thomas.weber@email.de',
                    phone: '+49 555 123456',
                    message: '',
                    timestamp: new Date(Date.now() - 172800000).toISOString(),
                    status: 'done'
                }
            ];

            requests = [...requests, ...testRequests];
            localStorage.setItem('contactRequests', JSON.stringify(requests));
            renderTable();
            updateStats();
        }

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            sessionStorage.removeItem('adminUser');
            sessionStorage.removeItem('adminRole');
            window.location.href = 'admin.html';
        }

        // Close modal on backdrop click
        document.getElementById('detail-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initial render
        renderTable();
        updateStats();

        // Listen for storage changes (for real-time updates if multiple tabs)
        window.addEventListener('storage', function(e) {
            if (e.key === 'contactRequests') {
                requests = JSON.parse(e.newValue) || [];
                renderTable();
                updateStats();
            }
        });
    </script>
</body>
</html>
